[project]
name = "news-radar"
version = "0.1.0"
description = "Staged AI news discovery, evidence collection, and briefing tools for a skill"
requires-python = ">=3.12"

# BeautifulSoup extracts readable article evidence and supports optional feed HTML.
# Playwright is imported lazily for explicit browser-rendered feed configurations.
# tzdata supplies Asia/Hong_Kong on Windows and minimal containers.
dependencies = [
    "beautifulsoup4>=4.12",
    "playwright>=1.58.0",
    "tzdata>=2024.1",
]

[project.scripts]
news-radar = "news_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["news_radar", "news_radar.config"]

[tool.setuptools.package-data]
"news_radar.config" = ["sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
