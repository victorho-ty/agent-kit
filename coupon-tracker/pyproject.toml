[project]
name = "coupon-tracker"
version = "1.0.0"
description = "Personal coupon tracking tools for a Hermes Agent skill"
requires-python = ">=3.11"

dependencies = [
    "python-ulid>=2.2.0",
    "PyYAML>=6.0",
    # Windows ships no system tz database, so zoneinfo cannot find
    # Asia/Hong_Kong without this. No-op on Linux/WSL.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.4",
]

[project.scripts]
couponctl = "coupon_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Listed explicitly rather than auto-discovered: a flat layout puts tests/ and
# docs/ beside the package, and `migrations` must ship as a real subpackage
# because db.py loads its .sql through importlib.resources.
packages = ["coupon_tracker", "coupon_tracker.migrations"]

[tool.setuptools.package-data]
coupon_tracker = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
