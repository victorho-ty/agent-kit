[project]
name = "hermes-household-expenses"
version = "1.0.0"
description = "Household expense tracking tools for a Hermes Agent skill"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.8.0"
]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
