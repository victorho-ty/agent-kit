# coupon-tracker configuration.
#
# Copy to config.yaml (or let `couponctl init` write it) in the bundle root.
# All relative paths resolve against the directory holding this file.

# Storage — each partitioned per account: media/<account_id>/, inbox/<account_id>/
db_path: coupons.db
media_dir: media
inbox_dir: inbox
logs_dir: logs

# App-wide. There are no per-account settings.
timezone: Asia/Hong_Kong

# Ingest: candidates below this extraction confidence route to needs_review.
review_threshold: 0.75

# Lifecycle: `couponctl unuse` without --force is refused beyond this window.
undo_window_hours: 48

# How many days ahead `alerts due` looks. This is also the repeat-rate control:
# there is no sent-ledger, so a coupon inside the window is reported once per
# run until used or expired. 1 = at most two messages (the day before, and the
# day it expires); raising it means more repeats, not fewer.
alert_days_before: 1

accounts:
  # Telegram user ids (as strings) permitted to auto-create an account on
  # first contact. Anyone else gets one "this bot is private" reply and is
  # ignored — nothing is written for them.
  allowlist: []
