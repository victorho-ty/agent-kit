[project]
name = "news-monitor"
version = "0.1.0"
description = "Polls a database of finance RSS feeds, classifies scope with JEV, and returns eligible unseen news"
requires-python = ">=3.12"

# RSS parsing and feed fetching use the standard library. The SDK supplies JEV
# decisions and bounded retries; tzdata supports minimal systems and Windows.
dependencies = [
    "tzdata>=2024.1",
    "typesafe-sdk>=0.7.3",
]

[project.scripts]
news-monitor = "news_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["news_monitor", "news_monitor.config"]

[tool.setuptools.package-data]
"news_monitor.config" = ["seeds.json", "taxonomy.json", "scope_prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
